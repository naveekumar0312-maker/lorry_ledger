<form
    method="post"
    action="{% url 'trips:rto_pc_edit' entry.id %}"
    class="edit-modal-form"
>
    {% csrf_token %}

    {% if errors %}
        <div class="alert alert-danger mb-3">
            <strong>Please fix the following:</strong>
            <ul class="mb-0 mt-2">
                {% for field, message in errors.items %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <div class="row g-3">

        <!-- PLACE -->
        <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">
                Place
            </label>

            <input
                type="text"
                name="place"
                class="form-control"
                value="{{ entry.place|default:'' }}"
                placeholder="Enter place"
                required
            >
        </div>

        <!-- TYPE -->
        <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">
                Type
            </label>

            <select
                name="expense_type"
                class="form-select"
                required
            >
                <option value="" disabled
                    {% if not entry.expense_type %}selected{% endif %}>
                    Select Type
                </option>

                <option
                    value="RTO"
                    {% if entry.expense_type == "RTO" %}selected{% endif %}
                >
                    RTO
                </option>

                <option
                    value="PC"
                    {% if entry.expense_type == "PC" %}selected{% endif %}
                >
                    PC
                </option>
            </select>
        </div>

        <!-- ONWARD -->
        <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">
                Onward
            </label>

            <div class="input-group">
                <span class="input-group-text">₹</span>

                <input
                    type="number"
                    name="onward_amount"
                    class="form-control"
                    step="0.01"
                    min="0"
                    value="{{ entry.onward_amount|default:'0.00' }}"
                    required
                >
            </div>
        </div>

        <!-- RETURN -->
        <div class="col-12 col-md-6">
            <label class="form-label fw-semibold">
                Return
            </label>

            <div class="input-group">
                <span class="input-group-text">₹</span>

                <input
                    type="number"
                    name="return_amount"
                    class="form-control"
                    step="0.01"
                    min="0"
                    value="{{ entry.return_amount|default:'0.00' }}"
                    required
                >
            </div>
        </div>

        <!-- TOTAL PREVIEW -->
        <div class="col-12">
            <div class="border rounded-3 p-3 bg-light">

                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">
                        Total
                    </span>

                    <strong
                        id="rtoPcModalTotal"
                        class="fs-5"
                    >
                        ₹{{ entry.total_amount|default:'0.00' }}
                    </strong>
                </div>

                <small class="text-muted">
                    Total = Onward + Return
                </small>

            </div>
        </div>

    </div>

    <!-- ACTION BUTTONS -->
    <div class="d-flex justify-content-end gap-2 mt-4">

        <button
            type="button"
            class="btn btn-light border"
            data-bs-dismiss="modal"
        >
            Cancel
        </button>

        <button
            type="submit"
            class="btn btn-primary"
        >
            <i class="bi bi-check2-circle me-1"></i>
            Save Changes
        </button>

    </div>

</form>

<script>
(function () {

    const modalBody = document.getElementById(
        'commonEditModalBody'
    );

    if (!modalBody) {
        return;
    }

    const onwardInput = modalBody.querySelector(
        'input[name="onward_amount"]'
    );

    const returnInput = modalBody.querySelector(
        'input[name="return_amount"]'
    );

    const totalElement = modalBody.querySelector(
        '#rtoPcModalTotal'
    );

    if (
        !onwardInput ||
        !returnInput ||
        !totalElement
    ) {
        return;
    }

    function updateTotal() {

        const onward =
            parseFloat(onwardInput.value) || 0;

        const returnAmount =
            parseFloat(returnInput.value) || 0;

        const total =
            onward + returnAmount;

        totalElement.textContent =
            '₹' + total.toFixed(2);
    }

    onwardInput.addEventListener(
        'input',
        updateTotal
    );

    returnInput.addEventListener(
        'input',
        updateTotal
    );

    updateTotal();

})();
</script>
