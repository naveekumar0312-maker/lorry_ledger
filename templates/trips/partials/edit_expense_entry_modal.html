<form
    method="post"
    action="{% url 'trips:expense_entry_edit' expense.id %}"
    class="edit-modal-form"
>

    {% csrf_token %}

    {% if errors %}
        <div class="alert alert-danger mb-3">
            <strong>Please fix the following:</strong>

            <ul class="mb-0 mt-2">
                {% for field, message in errors.items %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <div class="row g-3">

        <div class="col-12">

            <label class="form-label fw-semibold">
                Expense Name
            </label>

            <input
                type="text"
                name="expense_name"
                class="form-control"
                value="{{ expense.expense_name|default:'' }}"
                placeholder="Enter expense name"
                required
            >

        </div>


        <div class="col-12">

            <label class="form-label fw-semibold">
                Amount
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    ₹
                </span>

                <input
                    type="number"
                    name="amount"
                    class="form-control"
                    step="0.01"
                    min="0"
                    value="{{ expense.amount|default:'0.00' }}"
                    placeholder="0.00"
                    required
                >

            </div>

        </div>

    </div>


    <div class="d-flex justify-content-end gap-2 mt-4">

        <button
            type="button"
            class="btn btn-light border"
            data-bs-dismiss="modal"
        >
            Cancel
        </button>

        <button
            type="submit"
            class="btn btn-primary"
        >
            <i class="bi bi-check2-circle me-1"></i>
            Save Changes
        </button>

    </div>

</form>
