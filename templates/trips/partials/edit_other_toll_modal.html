<form
    method="post"
    action="{% url 'trips:other_toll_edit' toll.id %}"
    class="edit-modal-form"
>
    {% csrf_token %}

    <div class="row g-3">

        <div class="col-12">
            <label class="form-label fw-semibold">
                Toll Name
            </label>

            <input
                type="text"
                name="toll_name"
                class="form-control"
                value="{{ toll.toll_name|default:'' }}"
                placeholder="Enter toll name"
                required
            >
        </div>

        <div class="col-12">
            <label class="form-label fw-semibold">
                Amount
            </label>

            <div class="input-group">
                <span class="input-group-text">₹</span>

                <input
                    type="number"
                    name="amount"
                    class="form-control"
                    step="0.01"
                    min="0"
                    value="{{ toll.amount|default:'0.00' }}"
                    required
                >
            </div>
        </div>

    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">

        <button
            type="button"
            class="btn btn-light border"
            data-bs-dismiss="modal"
        >
            Cancel
        </button>

        <button
            type="submit"
            class="btn btn-primary"
        >
            <i class="bi bi-check2-circle me-1"></i>
            Save Changes
        </button>

    </div>
</form>
